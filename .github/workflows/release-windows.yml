name: Build Windows x64 component

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact component version to release
        required: true
        default: 0.1.0
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify requested version
        shell: pwsh
        run: |
          $component = Get-Content platforms/windows/component.json -Raw | ConvertFrom-Json
          if ($component.version -ne '${{ inputs.version }}') { throw 'Requested version does not match component.json' }
      - name: Test
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          python -m unittest discover -s tests -q
      - name: Build fixed Windows x64 package
        shell: pwsh
        run: .\packaging\windows\build_component.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: cua-component-${{ inputs.version }}-windows-x64-unsigned
          path: |
            dist/screen-automation-cua-component-${{ inputs.version }}-windows-x64.zip
            dist/screen-automation-cua-component-${{ inputs.version }}-windows-x64.zip.manifest.json
          retention-days: 7
