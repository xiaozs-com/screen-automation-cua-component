name: Release Windows x64 component

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact component version to release
        required: true
        default: 0.1.0
      confirm_scope:
        description: Type windows-x64-only
        required: true

permissions:
  contents: write

jobs:
  release:
    if: inputs.confirm_scope == 'windows-x64-only'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify requested version
        shell: pwsh
        run: |
          $component = Get-Content platforms/windows/component.json -Raw | ConvertFrom-Json
          if ($component.version -ne '${{ inputs.version }}') { throw 'Requested version does not match component.json' }
      - name: Test
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          python -m unittest discover -s tests -q
      - name: Build fixed Windows x64 package
        shell: pwsh
        run: .\packaging\windows\build_component.ps1 -Python python
      - name: Create and sign release metadata
        shell: pwsh
        env:
          COMPONENT_SIGNING_PRIVATE_KEY: ${{ secrets.COMPONENT_SIGNING_PRIVATE_KEY }}
        run: |
          python -m pip install --disable-pip-version-check cryptography==46.0.3
          $version = '${{ inputs.version }}'
          $archive = "dist/screen-automation-cua-component-$version-windows-x64.zip"
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$(Split-Path $archive -Leaf)"
          .\packaging\windows\create_release_metadata.ps1 -Archive $archive -DownloadUrl $url
          python packaging/sign_manifest.py dist/latest-windows-x64.json
          python packaging/sign_manifest.py dist/catalog.json
      - name: Publish immutable release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.version }}'
          $archive = "dist/screen-automation-cua-component-$version-windows-x64.zip"
          gh release create "v$version" $archive "$archive.manifest.json" dist/latest-windows-x64.json dist/catalog.json --title "Windows x64 component v$version" --notes "Windows x64 only. Background-required bounded runtime; no global installer, PATH change, autostart, Perception, FFmpeg, models, or application workflows."
